name: CI Pipeline
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "platform/terraform/**"
      - ".github/workflows/ci.yaml"

env:
  TF_VERSION: "1.14.3"

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [ "homelab", "prod-homelab" ]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}
    - name: Terraform Format
      id: fmt
      working-directory: platform/terraform/envs/${{ matrix.environment }}
      run: terraform fmt -check
    - name: Terraform Validate
      id: validate
      working-directory: platform/terraform/envs/${{ matrix.environment }}
      run: |
        terraform init -backend=false
        terraform validate
    - name: Terraform Init
      id: init
      working-directory: platform/terraform/envs/${{ matrix.environment }}
      run: terraform init
    - name: Terraform Lint
      id: lint
      working-directory: platform/terraform/envs/${{ matrix.environment }}
      run: tflint --init && tflint
      continue-on-error: true
    - name: Terraform Plan
      id: plan
      working-directory: platform/terraform/envs/${{ matrix.environment }}
      run: terraform plan -no-color
      continue-on-error: true
    - name: Comment PR
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      env:
        PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const output = `#### Terraform Format and Style 🚨\`${{ steps.fmt.outcome }}\`
          #### Terraform Lint 🚨\`${{ steps.lint.outcome }}\`
          #### Terraform Plan 🚀\`${{ steps.plan.outcome }}\`
          <details><summary>Show Plan</summary>
          \`\`\`\n${process.env.PLAN}\n\`\`\`
          </details>
          *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ inputs.workdir }}\`, Workflow: \`${{ github.workflow }}\`*`;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })
