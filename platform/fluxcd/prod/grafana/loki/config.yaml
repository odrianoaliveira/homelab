apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: grafana
data:
  values.yaml: |
      loki:
        schemaConfig:
          configs:
            - from: "2026-02-01"
              store: tsdb
              object_store: s3
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
        ingester:
          chunk_encoding: snappy
        querier:
          max_concurrent: 3
        pattern_ingester:
          enabled: true
        limits_config:
          allow_structured_metadata: true
          volume_enabled: true
          retention_period: 168h
        # storage:
        #   type: s3
        #   bucketNames:
        #     chunks: loki-chunks
        #     ruler: loki-ruler
        #   s3:
        #     endpoint: loki-minio.grafana.svc.cluster.local:9000
        #     secretAccessKey: minioadmin
        #     accessKeyId: minioadmin
        #     s3ForcePathStyle: true
        #     insecure: true

      deploymentMode: SimpleScalable

      backend:
        replicas: 2
      read:
        replicas: 2
      write:
        replicas: 3

      minio:
        enabled: true

      gateway:
        service:
          type: LoadBalancer